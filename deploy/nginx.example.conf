# Fronting the Embertop web dashboard.
#
# The dashboard has no login of its own, so the important part of this file is
# whatever `auth_request` (or equivalent) you already use for your backoffice.
# Serving it open to the internet publishes your traffic patterns.

location /embertop/ {
    # Only if the app was built with EMBERTOP_BASE_PATH=/embertop.
    proxy_pass http://127.0.0.1:3000/embertop/;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # /api/stream is Server-Sent Events: buffering it holds frames back until
    # the buffer fills, which looks exactly like a frozen fire.
    proxy_buffering   off;
    proxy_cache       off;
    proxy_read_timeout 1h;

    # Your existing backoffice authentication goes here.
    # auth_request /_auth;
}
