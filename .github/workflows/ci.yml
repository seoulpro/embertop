name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

# A new push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    strategy:
      fail-fast: false
      matrix:
        # The oldest supported runtime and current LTS.
        node-version: ["22.13.0", "24.x"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Test web and CLI
        run: npm test

      - name: Build the subpath deployment variant
        run: npm run build
        env:
          EMBERTOP_BASE_PATH: /backoffice/embertop

      - name: Verify package contents
        run: npm pack --dry-run --ignore-scripts
