name: Idea
description: Suggest something that would make the fire calmer or more useful.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Embertop is deliberately small. It is not trying to become a monitoring
        system, so ideas that keep it quiet and glanceable are the easiest to
        accept.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to see
      description: Describe the situation, not the implementation.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
    validations:
      required: true

  - type: checkboxes
    id: constraints
    attributes:
      label: Does it fit
      options:
        - label: It works when left open for hours without demanding attention.
        - label: It needs no personal data and no new privileges.
        - label: It respects `prefers-reduced-motion` if it moves.
